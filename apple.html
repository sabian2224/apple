<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>

    <style>
        .apple-logo {
            width: 20px;

            padding: 10px;
        }

        .section1{
            background-image: url(mackbook-pro.jpg);
            height: 600px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .section1 h1, .section1 h2, .section1 p {

        .pre-order-button {

<body>

    <div class="navigation-bar">

    </div>

    <div class="section1">
